[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvt-tool"
version = "0.1.0"
description = "Universal file format converter for AI agents and CLI use"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "cvt contributors" }]
keywords = ["converter", "file-format", "cli", "agent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Utilities",
]

# Core dependencies — always installed
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "lxml>=4.9",
    "markdown>=3.5",
    "html2text>=2020.1",
]

[project.optional-dependencies]
# Office document support
office = [
    "python-docx>=1.1",
    "mammoth>=1.6",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "docx2pdf>=0.1; sys_platform == 'win32' or sys_platform == 'darwin'",
]

# PDF support
pdf = [
    "weasyprint>=60.0",
    "pdfminer.six>=20221105",
]

# Image support
image = [
    "Pillow>=10.0",
]

# Everything
full = [
    "cvt-tool[office]",
    "cvt-tool[pdf]",
    "cvt-tool[image]",
]

# Dev / test
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "cvt-tool[full]",
]

[project.scripts]
cvt = "cvt.cli:main"

[project.urls]
Homepage = "https://github.com/pillow0705/cvt"
Repository = "https://github.com/pillow0705/cvt"
Issues = "https://github.com/pillow0705/cvt/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cvt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/cvt"]
